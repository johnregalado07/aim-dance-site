backend:
  name: github
  repo: johnregalado07/aim-dance-site
  branch: main
  base_url: https://YOUR-OAUTH-WORKER.workers.dev   # change this (see README)

media_folder: public/uploads
public_folder: /uploads

collections:
  - name: events
    label: Events
    label_singular: Event
    folder: src/content/events
    create: true
    extension: md
    format: frontmatter
    slug: '{{slug}}'
    summary: '{{title}} ({{date}})'
    sort: date:asc
    fields:
      - { name: title, label: Title, widget: string }
      - { name: date, label: Date, widget: datetime, time_format: false, date_format: 'YYYY-MM-DD', format: 'YYYY-MM-DD' }
      - { name: time, label: Time, widget: string, hint: 'Example: 3:00–5:00 PM' }
      - { name: location, label: Location, widget: select, options: [Melville, Commack] }
      - { name: ages, label: Ages, widget: string, required: false, hint: 'Example: 11+' }
      - { name: price, label: Price, widget: string, required: false, hint: 'Example: $35' }
      - { name: link, label: Ticket or sign-up link, widget: string, required: false }
      - { name: image, label: Flyer, widget: image, required: false }
      - { name: body, label: Description, widget: markdown }

  - name: staff
    label: Staff
    label_singular: Staff member
    folder: src/content/staff
    create: true
    extension: md
    format: frontmatter
    slug: '{{slug}}'
    summary: '{{name}}: {{role}}'
    fields:
      - { name: name, label: Name, widget: string }
      - { name: role, label: Title, widget: string }
      - { name: photo, label: Photo, widget: image, required: false }
      - { name: order, label: Display order, widget: number, default: 100, hint: 'Lower numbers appear first' }
      - { name: body, label: Bio, widget: markdown }

  - name: pages
    label: Pages and programs
    label_singular: Page
    folder: src/content/pages
    create: true
    extension: md
    format: frontmatter
    slug: '{{slug}}'
    fields:
      - { name: title, label: Title, widget: string }
      - { name: description, label: Short description, widget: string, required: false }
      - { name: section, label: Show in Programs menu, widget: select, options: [{ label: 'No', value: none }, { label: 'Yes', value: programs }], default: none }
      - { name: order, label: Menu order, widget: number, default: 100 }
      - { name: body, label: Page content, widget: markdown }

  - name: testimonials
    label: Testimonials
    label_singular: Testimonial
    folder: src/content/testimonials
    create: true
    extension: md
    format: frontmatter
    slug: '{{slug}}'
    fields:
      - { name: name, label: Name, widget: string }
      - { name: detail, label: Detail, widget: string, required: false, hint: 'Example: AIM parent' }
      - { name: order, label: Display order, widget: number, default: 100 }
      - { name: body, label: Quote, widget: markdown }

  - name: blog
    label: Blog
    label_singular: Post
    folder: src/content/blog
    create: true
    extension: md
    format: frontmatter
    slug: '{{slug}}'
    sort: date:desc
    fields:
      - { name: title, label: Title, widget: string }
      - { name: date, label: Date, widget: datetime, time_format: false, date_format: 'YYYY-MM-DD', format: 'YYYY-MM-DD' }
      - { name: summary, label: Short summary, widget: text, required: false }
      - { name: body, label: Post, widget: markdown }

  - name: settings
    label: Site settings
    files:
      - name: banner
        label: Announcement banner
        file: src/data/banner.json
        fields:
          - { name: show, label: Show banner, widget: boolean }
          - { name: message, label: Message, widget: string }
      - name: locations
        label: Locations and contact
        file: src/data/locations.json
        fields:
          - name: locations
            label: Studios
            widget: list
            fields:
              - { name: name, label: Name, widget: string }
              - { name: address, label: Address, widget: string }
              - { name: phone, label: Phone, widget: string }
              - { name: portal, label: Portal link, widget: string }
          - { name: email, label: Contact email, widget: string }
          - { name: facebook, label: Facebook link, widget: string }
          - { name: instagram, label: Instagram link, widget: string }
